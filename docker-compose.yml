# Registration Service'i LOKALDE uctan uca denemek icin.
# Gercek Event Service (Grup 3) yerine nginx ile sahte bir servis kullanilir.
# Final entegrasyonu campushub-integration reposundaki compose ile yapilacak.
#
#   docker compose up -d --build
#   curl http://localhost:8004/health
#   docker compose down

services:
  registration-service:
    build: .
    container_name: registration-container
    ports:
      - "8004:8004"
    environment:
      PORT: "8004"
      DB_PATH: /app/data/registrations.db
      EVENT_SERVICE_URL: http://event-container:8002
    volumes:
      - registration-data:/app/data
    depends_on:
      event-service:
        condition: service_healthy
    restart: unless-stopped

  # SAHTE Event Service (sadece lokal test icin)
  event-service:
    image: nginx:1.27-alpine
    container_name: event-container
    ports:
      - "8002:8002"
    volumes:
      - ./mock-event-service/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mock-event-service/events:/usr/share/nginx/html/events:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  registration-data:
