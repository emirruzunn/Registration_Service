# Grup 3'un gercek Event Service'i hazir olana kadar kullanilan SAHTE servis.
# Sadece Registration Service'in ihtiyac duydugu GET /events/{id} ve /health cevaplanir.
server {
    listen 8002;
    default_type application/json;
    root /usr/share/nginx/html;

    location = /health {
        return 200 '{"service":"event-service-mock","status":"UP","version":"mock"}';
    }

    # GET /events/31 -> events/31.json ; dosya yoksa 404
    location ~ ^/events/(\d+)$ {
        try_files /events/$1.json =404;
    }

    # Hata testi icin: bu etkinlik her zaman 500 doner
    location = /events/500 {
        return 500 '{"error":"INTERNAL_ERROR","message":"Mock failure."}';
    }

    error_page 404 /404.json;
    location = /404.json {
        internal;
        return 404 '{"error":"EVENT_NOT_FOUND","message":"Event does not exist."}';
    }
}
